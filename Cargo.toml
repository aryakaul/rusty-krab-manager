[package]
name = "rusty-krab-manager"
version = "2.0.0"
authors = ["luak <contact@arya.casa>"]
edition = "2021"
rust-version = "1.89"
readme = "README.md"
license-file = "./LICENSE"
description = """
Time management TUI inspired by the pomodoro technique as described by Francesco Cirillo
"""
homepage = "https://github.com/aryakaul/rusty-krab-manager"
repository = "https://github.com/aryakaul/rusty-krab-manager"
documentation = "https://github.com/aryakaul/rusty-krab-manager/wiki"
keywords = ["time-management", "tui", "rusty-krab-manager"]
categories = ["command-line-utilities"]
exclude = ["example/*"]


[dependencies]
rand = "0.10.2"
chrono = { version = "0.4.22", features = ["serde"] }
ratatui = "0.29"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = [
	"macros",
	"rt-multi-thread",
	"time",
	"sync",
] }
futures = "0.3"
config = "0.13.2"
rodio = "0.22.2"
dirs = "6"
pathsep = "0.1"
tinytemplate = "1.2.1"
serde ={ version = "1.0.123", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
clap = "4.0.18"
notify-rust = "4.5.10"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = [
	"json",
	"rustls-tls",
] }
toml = "0.8"
